<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian Bank — Help</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #e8ede9;
    --surface: #ffffff;
    --ink: #13201c;
    --ink-soft: #55655f;
    --line: #cfdad4;
    --accent: #14655d;
    --accent-ink: #ffffff;
    --mine: #dbe6e0;
    --warn: #9a4a24;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1513; --surface: #161e1b; --ink: #e6ede9; --ink-soft: #8fa199;
      --line: #25322e; --accent: #5fd2c2; --accent-ink: #08201d; --mine: #1d2a26; --warn: #e0a06a;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; }
  body {
    height: 100%; margin: 0; display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%;
  }
  header {
    flex: 0 0 auto; display: flex; align-items: baseline; gap: 12px;
    padding: 14px 18px 12px; border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .mark { font-family: "Newsreader", Georgia, serif; font-size: 25px; margin: 0; font-weight: 500; letter-spacing: -0.01em; }
  .mark .dot { color: var(--accent); }
  .tag { color: var(--ink-soft); font-size: 13px; flex: 1; }
  .ghost {
    font: inherit; font-size: 13px; color: var(--ink-soft); background: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .ghost:hover { color: var(--ink); border-color: var(--ink-soft); }

  #thread { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 22px 18px 8px; }
  .inner { max-width: 660px; margin: 0 auto; }
  .turn { margin-bottom: 26px; }
  .turn.mine { display: flex; justify-content: flex-end; }
  .turn.mine .body {
    background: var(--mine); border-radius: 14px 14px 4px 14px; padding: 10px 14px;
    max-width: 88%; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .turn.theirs .body {
    font-family: "Newsreader", Georgia, serif; font-size: 19px; line-height: 1.62;
    border-left: 2px solid var(--accent); padding-left: 16px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .turn.theirs .body.pending { color: var(--ink-soft); font-style: italic; }
  .turn.theirs .note { margin-top: 8px; padding-left: 18px; font-family: "IBM Plex Sans", sans-serif; font-size: 13px; color: var(--warn); }

  #welcome h2 { font-family: "Newsreader", Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.25; margin: 0 0 8px; }
  #welcome p { color: var(--ink-soft); margin: 0 0 22px; max-width: 46ch; }
  .starters { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .starter {
    font: inherit; font-size: 15px; text-align: left; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; max-width: 100%;
  }
  .starter:hover { border-color: var(--accent); }

  #composer { flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--bg); padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .box {
    max-width: 660px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 14px;
  }
  .box:focus-within { border-color: var(--accent); }
  #input { flex: 1 1 auto; font: inherit; color: var(--ink); background: none; border: 0; resize: none; outline: none; max-height: 30vh; padding: 6px 0; line-height: 1.45; }
  #input::placeholder { color: var(--ink-soft); }
  #send, #stop { flex: 0 0 auto; font: inherit; font-size: 15px; font-weight: 500; border: 0; border-radius: 11px; padding: 9px 16px; cursor: pointer; }
  #send { background: var(--accent); color: var(--accent-ink); }
  #send:disabled { opacity: .4; cursor: default; }
  #stop { background: none; color: var(--warn); border: 1px solid var(--line); }
  #status { max-width: 660px; margin: 8px auto 0; font-size: 13px; color: var(--ink-soft); min-height: 1em; }
  #status.bad { color: var(--warn); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media (max-width: 420px) { .turn.theirs .body { font-size: 18px; padding-left: 13px; } #welcome h2 { font-size: 26px; } }
</style>
</head>
<body>

<header>
  <h1 class="mark">Meridian<span class="dot">.</span></h1>
  <span class="tag">Meridian Bank help</span>
  <button id="reset" class="ghost" type="button">New chat</button>
</header>

<main id="thread">
  <div class="inner">
    <section id="welcome">
      <h2>How can we help?</h2>
      <p>Ask about accounts, fees, cards, limits or branches. This assistant cannot see your account. Never type your PIN, password or card number here.</p>
      <div class="starters">
        <button class="starter" type="button">What do I need to open an account?</button>
        <button class="starter" type="button">How much is an international transfer?</button>
        <button class="starter" type="button">What is my daily ATM limit?</button>
        <button class="starter" type="button">My card is lost</button>
      </div>
    </section>
    <div id="turns"></div>
  </div>
</main>

<div id="composer">
  <div class="box">
    <textarea id="input" rows="1" placeholder="Write a message…" autocomplete="off"></textarea>
    <button id="stop" type="button" hidden>Stop</button>
    <button id="send" type="button" disabled>Send</button>
  </div>
  <div id="status"></div>
</div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "ask.turns.v1";
  var thread   = document.getElementById("thread");
  var turnsEl  = document.getElementById("turns");
  var welcome  = document.getElementById("welcome");
  var input    = document.getElementById("input");
  var sendBtn  = document.getElementById("send");
  var stopBtn  = document.getElementById("stop");
  var resetBtn = document.getElementById("reset");
  var statusEl = document.getElementById("status");

  var turns = load();
  var busy = false;
  var ctl = null;

  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
      return Array.isArray(v) ? v.filter(function (t) {
        return t && (t.role === "user" || t.role === "assistant") && typeof t.content === "string" && t.content;
      }) : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(turns.slice(-40))); } catch (e) {}
  }

  function setStatus(text, bad) {
    statusEl.textContent = text || "";
    statusEl.className = bad ? "bad" : "";
  }
  function addTurn(role, text) {
    var wrap = document.createElement("div");
    wrap.className = "turn " + (role === "user" ? "mine" : "theirs");
    var body = document.createElement("div");
    body.className = "body";
    body.textContent = text;
    wrap.appendChild(body);
    turnsEl.appendChild(wrap);
    welcome.hidden = true;
    return body;
  }
  function note(bodyEl, text) {
    var n = document.createElement("div");
    n.className = "note";
    n.textContent = text;
    bodyEl.parentNode.appendChild(n);
  }
  function nearBottom() { return thread.scrollHeight - thread.scrollTop - thread.clientHeight < 140; }
  function toBottom() { thread.scrollTop = thread.scrollHeight; }
  function renderAll() {
    turnsEl.textContent = "";
    turns.forEach(function (t) { addTurn(t.role, t.content); });
    welcome.hidden = turns.length > 0;
    toBottom();
  }
  function setBusy(on) {
    busy = on;
    sendBtn.disabled = on || !input.value.trim();
    stopBtn.hidden = !on;
  }
  function copyFor(code) {
    if (code === "busy") return "The service is busy right now. Please try again in a moment.";
    if (code === "rate_limited") return "Too many messages right now. Wait a minute, then try again.";
    if (code === "bad_key") return "The server's API key is not valid. Check the .env file.";
    if (code === "model_missing") return "That model name is wrong. Check the server terminal for valid ones.";
    if (code === "refused") return "That one could not be answered. Try asking it a different way.";
    return "Something went wrong. Try sending it again.";
  }

  function ask(text) {
    if (busy) return;
    turns.push({ role: "user", content: text });
    addTurn("user", text);
    save();

    var body = addTurn("assistant", "Thinking…");
    body.classList.add("pending");
    toBottom();
    setBusy(true);
    setStatus("");

    ctl = new AbortController();
    var answer = "";
    var failed = null;

    fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: turns }),
      signal: ctl.signal
    }).then(function (res) {
      if (!res.ok || !res.body) throw new Error("bad response");
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          buffer += decoder.decode(r.value, { stream: true });
          var chunks = buffer.split("\n\n");
          buffer = chunks.pop() || "";

          chunks.forEach(function (chunk) {
            chunk.split("\n").forEach(function (line) {
              if (line.indexOf("data:") !== 0) return;
              var msg;
              try { msg = JSON.parse(line.slice(5).trim()); } catch (e) { return; }
              if (msg.error) { failed = msg.error; return; }
              if (typeof msg.text === "string") {
                if (!answer) body.classList.remove("pending");
                answer += msg.text;
                var stick = nearBottom();
                body.textContent = answer;
                if (stick) toBottom();
              }
            });
          });
          return pump();
        });
      }
      return pump();
    }).then(function () {
      body.classList.remove("pending");
      if (answer) {
        body.textContent = answer;
        turns.push({ role: "assistant", content: answer });
        save();
        if (failed) note(body, copyFor(failed));
      } else {
        turnsEl.removeChild(body.parentNode);
        setStatus(copyFor(failed), true);
      }
      setBusy(false);
      toBottom();
    }).catch(function (err) {
      body.classList.remove("pending");
      if (answer) {
        turns.push({ role: "assistant", content: answer });
        save();
        note(body, err.name === "AbortError" ? "Stopped." : "The answer was interrupted.");
      } else {
        turnsEl.removeChild(body.parentNode);
        setStatus(err.name === "AbortError" ? "Stopped." : "Cannot reach the server. Is it running?", err.name !== "AbortError");
      }
      setBusy(false);
    });
  }

  function grow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.3) + "px";
  }
  function submit() {
    var text = input.value.trim();
    if (!text || busy) return;
    input.value = "";
    grow();
    ask(text);
  }

  input.addEventListener("input", function () { grow(); sendBtn.disabled = busy || !input.value.trim(); });
  var hardKeyboard = window.matchMedia && window.matchMedia("(pointer: fine)").matches;
  input.addEventListener("keydown", function (e) {
    if (hardKeyboard && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  sendBtn.addEventListener("click", submit);
  stopBtn.addEventListener("click", function () { if (ctl) ctl.abort(); });
  resetBtn.addEventListener("click", function () {
    if (ctl && busy) ctl.abort();
    turns = []; save(); renderAll(); setStatus(""); input.focus();
  });
  Array.prototype.forEach.call(document.querySelectorAll(".starter"), function (b) {
    b.addEventListener("click", function () {
      input.value = b.textContent; grow(); input.focus(); sendBtn.disabled = busy;
    });
  });

  renderAll();
  input.focus();
})();
</script>
</body>
</html>
